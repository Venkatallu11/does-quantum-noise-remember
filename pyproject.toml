[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "does-quantum-noise-remember"
version = "0.1.0"
description = "A falsifiable simulator and inference framework for testing memory in quantum-device noise."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
